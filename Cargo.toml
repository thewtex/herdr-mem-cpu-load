[package]
name = "herdr-mem-cpu-load"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "CPU, memory, and load average monitor plugin for herdr, re-imagined from tmux-mem-cpu-load"
license = "Apache-2.0"
repository = "https://github.com/thewtex/herdr-mem-cpu-load"
keywords = ["herdr", "tmux", "cpu", "memory", "monitor"]
categories = ["command-line-utilities"]
# `cargo package` ships the crate and the three files that explain it, and
# nothing else: not the playbooks, not the CI workflows, not the release
# scripts, not the integration tests that spawn a daemon.
include = [
    "src/**",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "herdr-plugin.toml",
]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# The seeding of herdr's own config.toml edits a file this plugin does not
# own, so it goes through toml_edit, which keeps every key, comment, and blank
# line that was already there. `toml` builds on it, so it costs no new crate.
toml_edit = "0.22"

# Linux, macOS, and the BSDs all reach the kernel through libc.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# `GetSystemTimes` lives in Win32_System_Threading; `GlobalMemoryStatusEx`,
# `MEMORYSTATUSEX`, `GetSystemInfo`, and `SYSTEM_INFO` in
# Win32_System_SystemInformation; `FILETIME` in Win32_Foundation. `LockFileEx`,
# which makes the daemon a singleton, is in Win32_Storage_FileSystem and takes
# an `OVERLAPPED` from Win32_System_IO, so it needs both.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# The port does a lot of intentional numeric casts between integer counters and
# the floating point percentages the original C++ printed.
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
module_name_repetitions = "allow"
