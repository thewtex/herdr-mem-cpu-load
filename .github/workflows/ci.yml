name: CI

# Every action is pinned to a commit SHA, the way the herdr repository pins
# them: a tag can be moved, a SHA cannot.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      # dtolnay/rust-toolchain takes the toolchain from the action ref, so a
      # SHA-pinned use has to name `stable` explicitly.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: stable
          components: rustfmt,clippy

      - name: Restore cargo cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ${{ matrix.os }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Build the release binary
        run: cargo build --release --locked

      # The first time the macOS and Windows backends from Phase 03 run
      # anywhere: everything before this only type-checked them.
      - name: Smoke the release binary
        shell: bash
        run: |
          set -euo pipefail
          bin=target/release/herdr-mem-cpu-load
          if [ "$RUNNER_OS" = "Windows" ]; then
            bin="$bin.exe"
          fi
          echo "one line:"
          "$bin" --interval 1
          echo "blocks:"
          "$bin" --interval 1 --graph-style blocks

  cross-check:
    name: cross-check (freebsd)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The BSD stub only has to keep compiling. If the rust-std component for
    # the target is ever unavailable the job is skipped rather than red.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: stable
          targets: x86_64-unknown-freebsd

      - name: Restore cargo cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: cross-check

      - name: Check the unsupported-platform stub
        run: cargo check --locked --target x86_64-unknown-freebsd

  manifest:
    name: manifest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      # herdr indexes the marketplace straight from this file, and a plugin
      # whose manifest version drifts from its crate version installs one
      # thing and reports another.
      - name: Validate herdr-plugin.toml
        run: python3 scripts/check_manifest.py
