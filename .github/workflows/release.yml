name: Release

# Pushing a `v*` tag builds a binary for every supported target and attaches
# the archives to a GitHub release. `scripts/release.sh` is what creates the
# tag; nothing here bumps a version.
#
# Actions are pinned by commit SHA, as in ci.yml.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          # A native arm64 Linux runner, so no `cross` and no QEMU. Optional:
          # if the runner label is not available to this repository the job
          # is skipped rather than failing the release.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            archive: tar.gz
            optional: true
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
          # Cross-compiled from the x86_64 runner; the windows-latest image
          # ships the MSVC ARM64 build tools.
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            archive: zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    continue-on-error: ${{ matrix.optional == true }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Restore cargo cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: release-${{ matrix.target }}

      # A tag that does not match the crate would publish an archive whose
      # name lies about what is inside it.
      - name: Check the tag against the crate version
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          crate_version=$(awk -F'"' '/^version = /{ print $2; exit }' Cargo.toml)
          if [ "$tag_version" != "$crate_version" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml $crate_version" >&2
            exit 1
          fi
          echo "VERSION=$tag_version" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="herdr-mem-cpu-load-${VERSION}-${{ matrix.target }}"
          bin="herdr-mem-cpu-load"
          if [ "$RUNNER_OS" = "Windows" ]; then
            bin="$bin.exe"
          fi

          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/$bin" "dist/$name/"
          cp README.md LICENSE "dist/$name/"

          cd dist
          if [ "${{ matrix.archive }}" = zip ]; then
            7z a -tzip "$name.zip" "$name" >/dev/null
          else
            tar -czf "$name.tar.gz" "$name"
          fi
          rm -rf "$name"
          ls -l

      - name: Upload the archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Download every archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          merge-multiple: true

      - name: Take the release notes from the changelog
        run: python3 scripts/changelog_section.py "$GITHUB_REF_NAME" > RELEASE_NOTES.md

      - name: Publish
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          body_path: RELEASE_NOTES.md
          files: dist/*
          fail_on_unmatched_files: true
