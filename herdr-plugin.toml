id = "thewtex.mem-cpu-load"
name = "Mem CPU Load"
version = "0.1.1"
min_herdr_version = "0.8.0"
description = "CPU, memory, and load average status for the Space sidebar"
platforms = ["linux", "macos", "windows"]

# One build command for every platform. The Windows build needs whichever
# toolchain `cargo` is already configured with — `x86_64-pc-windows-msvc` (the
# default, requiring the Visual Studio build tools) or `x86_64-pc-windows-gnu`
# (requiring mingw-w64). Nothing here selects one; `cargo` uses the host
# default, and both are type-checked in CI.
[[build]]
command = ["cargo", "build", "--release", "--locked"]

# The tokens the daemon reports only reach the sidebar once
# `[ui.sidebar.spaces]` names them, and that table is in herdr's own
# config.toml rather than this plugin's, so the freshly built binary seeds it
# here — with the two rows herdr shows by default plus one row per metric.
#
# It runs after the build because it is the built binary; it touches nothing
# when a layout is already set; and it exits 0 whatever happens, including a
# config.toml that cannot be read or does not parse, because a sidebar that
# has to be arranged by hand is not a reason to fail an install. `herdr plugin
# install` runs `[[build]]`; `herdr plugin link` does not, so a linked plugin
# gets the rows from the `write-sidebar-rows` action below.
[[build]]
command = ["target/release/herdr-mem-cpu-load", "--write-sidebar-rows"]

# herdr resolves a relative program that contains a path separator against the
# plugin root, so the release binary can be named directly and no launcher
# script is needed. The daemon runs until herdr goes away.
[[startup]]
command = ["target/release/herdr-mem-cpu-load", "--daemon"]
platforms = ["linux", "macos"]

[[startup]]
command = ["target/release/herdr-mem-cpu-load.exe", "--daemon"]
platforms = ["windows"]


# A popup with a live status line, for when the sidebar rows are not enough:
#
#   herdr plugin pane open --plugin thewtex.mem-cpu-load --entrypoint status
#
# Unlike `[[startup]]`, pane and action ids must be unique across the whole
# manifest, so there is no room for a second `.exe` entry gated on Windows.
# There is no need for one either: herdr resolves a relative program against
# the plugin root and hands it to the OS, which appends `.exe` when the name
# has no extension.
[[panes]]
id = "status"
title = "System status"
description = "A live CPU, memory, and load average status line"
placement = "popup"
width = "60%"
height = 3
command = ["target/release/herdr-mem-cpu-load", "--watch", "--graph-style", "blocks"]

# Two cheap actions that write into the plugin command log rather than opening
# anything: one to see what the merged configuration came out as, and one to
# drop a commented config.toml into the plugin config directory.
[[actions]]
id = "show-status"
title = "Show system status"
description = "Print the effective configuration into the plugin log"
contexts = ["workspace"]
command = ["target/release/herdr-mem-cpu-load", "--print-config"]

[[actions]]
id = "write-sidebar-rows"
title = "Add the system rows to the Space sidebar"
description = "Lay out [ui.sidebar.spaces] in herdr's config.toml if nothing has yet"
contexts = ["workspace"]
command = ["target/release/herdr-mem-cpu-load", "--write-sidebar-rows"]

[[actions]]
id = "write-config"
title = "Write a default config.toml"
description = "Create a commented config.toml in the plugin config directory"
contexts = ["workspace"]
command = ["target/release/herdr-mem-cpu-load", "--write-default-config"]
